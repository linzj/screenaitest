[package]
name = "chrome_ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
# Image processing
image = "0.25"

# CLI and utilities
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

# Path and filesystem
dirs = "5"
walkdir = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# TFLite C API bindings with XNNPACK acceleration
tflitec = { version = "0.7", features = ["xnnpack"] }

# Array operations
ndarray = "0.16"

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Dynamic library loading
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
debug = true
